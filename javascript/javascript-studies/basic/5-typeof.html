<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <script>
      // Função para conferir o tipo de dado de uma variável

      let car;
      console.log(typeof car);

      car = "Volvo";
      console.log(typeof car);

      car = 17;
      console.log(typeof car);
    </script>
  </body>

<!DOCTYPE html>
<html>
  <body>
    <h1>Testando o <code>window.prompt()</code></h1>
    <h3>Seu nome é <span id="nome"></span></h3>

    <script>
      let nome = window.prompt("Qual é o seu nome?"); // Exibe uma caixa de diálogo solicitando uma informação do usuário
      document.getElementById("nome").innerText = nome;
    </script>
  </body>
</html>

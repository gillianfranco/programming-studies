<!DOCTYPE html>
<html>
  <body>
    <div id="teste">Teste</div>
    <button type="button" onclick="helloWorld()">Clique Aqui</button>

    <script>
      // Substitui o conteúdo na tag que possui a ID informada
      function helloWorld() {
        document.getElementById("teste").innerHTML = "<h1>Hello World!</h1>"; // O ponto e vírgula é opcional
      }
    </script>
  </body>
</html>

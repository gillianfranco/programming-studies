<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <script>
      // Soma de strings
      let s1 = "Lógica de Programação";
      s1 = s1 + " e Algoritmos";
      console.log(s1);

      // String Templates
      console.log(`A próxima disciplina será "${s1}"`);

      // Concatenações entre tipos de dados diferentes
      let s2 = 15 + 2 + "string";
      console.log(s2); // Imprime a string "17string"

      let s3 = "string" + 15 + 2;
      console.log(s3); // Imprime a string "string152"
    </script>
  </body>
</html>

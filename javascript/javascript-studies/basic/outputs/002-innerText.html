<!DOCTYPE html>
<html>
  <body>
    <div id="teste">Teste</div>
    <button type="button" onclick="helloWorld()">Clique Aqui</button>

    <script>
      // Substitui o texto na tag que possui a ID informada
      function helloWorld() {
        document.getElementById("teste").innerText = "<h1>Hello World!</h1>"; // A tag <h1></h1> não será considerada
      }
    </script>
  </body>
</html>
